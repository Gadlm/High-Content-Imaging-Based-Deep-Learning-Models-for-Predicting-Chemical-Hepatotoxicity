[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hci-hepatotoxicity"
version = "0.1.0"
description = "High-Content Imaging-Based Deep Learning Models for Predicting Chemical Hepatotoxicity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "imbalanced-learn>=0.12",
  "scikit-image>=0.21",
  "scikit-learn>=1.3"
]

[project.optional-dependencies]
deep = ["tensorflow>=2.15"]

[tool.setuptools.packages.find]
where = ["src"]
